[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nethor"
version = "0.1.0"
description = "Nethor: a personal Discord assistant on the Claude Agent SDK"
requires-python = ">=3.12"
dependencies = ["claude-agent-sdk>=0.2.183", "discord.py>=2.7", "python-dotenv>=1.2", "tzdata"]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
